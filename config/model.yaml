# xgboost settings, split proposed for now (arbitrary)

# detector cols, rhea's technical cols (technical.py), rishi's macro cols
features: [rsi, atr_pct, dist_ema, dist_sma, trend_gap, afternoon,
           macd_pct, macd_hist_pct, macd_hist_chg, vol_long, vol_ratio, rel_volume, pullback_volume,
           vix_close, vix_chg_5d, vix_vs_ma20, gdelt_tone_72h, gdelt_goldstein_72h, gdelt_us_tone_72h, gdelt_tone_chg, gdelt_volume_ratio]
# relative strength (relative.py) tested w/ walk_forward_xgb, didnt help so left out: rs_spy_20, rs_spy_short, rs_rank_20

split:
  test_frac: 0.2      # last 20% of setups by time = final test
  embargo_days: 3     # train trades have to close beforetest/val window 
  n_folds: 4          # walk forward folds in train for tuning

walk_forward:         # scripts.walk_forward_xgb, retrain + predict window by window over all of history
  n_windows: 8        # time chunks after the first
  inner_folds: 3      # tuning folds inside each window's train
  min_train: 250      # skip windows w/ less history than this

threshold: 0.5        # prob >= this =predict win

xgb:                  # fixed settings, tunes grid below
  subsample: 0.8
  colsample_bytree: 0.8

grid:
  max_depth: [2, 3, 4]
  learning_rate: [0.03, 0.1]
  n_estimators: [100, 300]
  min_child_weight: [5, 20]
